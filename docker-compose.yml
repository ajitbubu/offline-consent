# Local development database. Production is out of scope for this compose file.
services:
  postgres:
    image: postgres:16-alpine
    container_name: offline-consent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: offline_consent
      POSTGRES_PASSWORD: offline_consent
      POSTGRES_DB: offline_consent
    ports:
      # 5433 on the host so this never collides with a system Postgres on 5432.
      - "5433:5432"
    volumes:
      - offline_consent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U offline_consent -d offline_consent"]
      interval: 5s
      timeout: 5s
      retries: 10

  # OCR and tick-box extraction. Optional: with this down, or ML_SERVICE_URL
  # unset, the review screen is simply the manual entry form. One degradation
  # path, not two - which is why intake_draft has no 'extracting' status.
  ml:
    build: ./ml
    container_name: offline-consent-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  offline_consent_pgdata:
